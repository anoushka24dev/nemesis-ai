[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-eval"
version = "0.1.0"
description = "Adaptive AI Agent Defense Evaluation Framework"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.25",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "rich>=13.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[project.scripts]
adaptive-eval = "adaptive_agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_agent_eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
